name: Build 1.13.8 REALITY MLKEM

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reality-mlkem-v1.13.8
    paths:
      - common/tls/reality_client.go
      - .github/workflows/build-personal-mlkem.yml

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  VERSION: 1.13.8-mlkem
  UPX_VERSION: 5.3.0

jobs:
  router:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-go@v5
        with:
          go-version: "~1.25.9"

      - name: Prepare official ARM64 musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '\r\n' < .github/CRONET_GO_VERSION)"
          toolchain="$RUNNER_TEMP/cronet-go"
          git init "$toolchain"
          git -C "$toolchain" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$toolchain" fetch --depth=1 origin "$revision"
          git -C "$toolchain" checkout FETCH_HEAD
          git -C "$toolchain" submodule update --init --recursive --depth=1
          cd "$toolchain"
          rm -f naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/arm64 --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/arm64 --libc=musl env >> "$GITHUB_ENV"

      - name: Build full-feature ARM64 musl core
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS),with_musl"
          flags="$(tr -d '\r\n' < release/LDFLAGS) -s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${VERSION}"
          go build -mod=readonly -trimpath -tags "$tags" -ldflags "$flags" \
            -o dist/sing-box.raw ./cmd/sing-box

      - name: Compress executable with UPX
        shell: bash
        run: |
          set -euo pipefail
          archive="upx-${UPX_VERSION}-amd64_linux"
          curl -fL --retry 3 \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${archive}.tar.xz" \
            -o "$RUNNER_TEMP/upx.tar.xz"
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$archive/upx" --best --lzma -o dist/sing-box dist/sing-box.raw
          ls -lh dist/sing-box

      - name: Upload compressed core
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-1.13.8-mlkem-linux-arm64-musl-upx
          path: dist/sing-box

  desktop:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-go@v5
        with:
          go-version: "~1.25.9"

      - name: Build full Windows x64 core without UPX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows-amd64
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_WINDOWS)"
          flags="$(tr -d '\r\n' < release/LDFLAGS) -s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${VERSION}"
          GOOS=windows GOARCH=amd64 GOAMD64=v1 go build -mod=readonly -trimpath \
            -tags "$tags" -ldflags "$flags" -o dist/windows-amd64/sing-box.exe ./cmd/sing-box
          go mod download github.com/sagernet/cronet-go/lib/windows_amd64
          library_dir="$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64)"
          cp "$library_dir/libcronet.dll" dist/windows-amd64/libcronet.dll

      - name: Upload desktop core without executable compression
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-1.13.8-mlkem-windows-amd64
          path: dist/windows-amd64/
